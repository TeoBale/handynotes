[package]
name = "handynotes"
version = "0.1.0"
edition = "2024"

[dependencies]
raw-window-handle = "0.6"
gpui-kit = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
chrono = "0.4"
async-channel = "2"
base64 = "0.22"
ureq = { version = "3", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
markdown = "1.0.0"
linkify = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.dev]
debug = 0
incremental = false

[build-dependencies]
dotenvy = "0.15"
